name: Build, test and package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verify:
    name: Test and package (${{ matrix.platform }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            bundles: dmg
          - os: macos-15-intel
            platform: macos-x64
            bundles: dmg
          - os: windows-2022
            platform: windows-x64
            bundles: nsis
          - os: ubuntu-24.04
            platform: linux-x64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master, pinned
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64 xdg-utils
      - name: Record tool versions
        run: |
          node --version
          pnpm --version
          rustc --version
          cargo --version
          git --version
      - name: Check release versions and packaging helpers
        run: |
          node scripts/ci-release.mjs check
          node --test scripts/ci-release.test.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --maxWorkers=2
      # Tauri's Rust context needs production frontend assets for test builds.
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --features native-smoke -- -D warnings
      - name: Run Rust tests
        id: rust-tests
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: |
          mkdir -p .tools/windows-loader-diagnostics
          cargo test --manifest-path src-tauri/Cargo.toml --locked 2>&1 | tee .tools/windows-loader-diagnostics/cargo-test.log
      - name: Diagnose Windows test-loader failure
        if: runner.os == 'Windows' && steps.rust-tests.outcome == 'failure'
        shell: pwsh
        run: ./scripts/windows-diagnose.ps1
      - name: Upload Windows loader diagnostics
        if: always() && runner.os == 'Windows' && steps.rust-tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: git-view-windows-loader-diagnostics
          path: .tools/windows-loader-diagnostics/*
          if-no-files-found: error
          retention-days: 14
      - name: Fail after Windows loader diagnosis
        if: always() && runner.os == 'Windows' && steps.rust-tests.outcome == 'failure'
        run: exit 1
      - name: Build macOS package (ad-hoc signed, not notarized)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: pnpm tauri build --ci --bundles dmg -- --locked
      - name: Build Windows or Linux packages (unsigned)
        if: runner.os != 'macOS'
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: pnpm tauri build --ci --bundles "$BUNDLES" -- --locked
      - name: Check release CLI and collect exact packages
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          node scripts/ci-release.mjs smoke
          node scripts/ci-release.mjs collect "$PACKAGE_PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: git-view-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Create reviewed-release draft
    needs: verify
    # PRs, main pushes and manual runs never get a publication token.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: git-view-*
          path: downloaded-packages
          # Keep per-platform folders so duplicate/missing packages cannot hide.
          merge-multiple: false
      - name: Verify all packages and generate checksums
        run: node scripts/ci-release.mjs assemble
      - name: Create draft (never overwrite an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ci-release.mjs draft
